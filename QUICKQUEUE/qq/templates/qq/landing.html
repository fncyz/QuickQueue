{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQueue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="{% static 'qq/images/bg01.png' %}">
    <link rel="preload" as="image" href="{% static 'qq/images/card_bg.png' %}">
    <link rel="preload" as="image" href="{% static 'qq/images/logincard_01.png' %}">
    <link rel="preload" as="image" href="{% static 'qq/images/logincard_02.png' %}">
    <link rel="preload" as="image" href="{% static 'qq/images/login_card.png' %}">
    <link rel="stylesheet" href="{% static 'qq/css/landing.css' %}">
</head>
<body>
    <main class="landing-page">
        <section class="hero-card" aria-labelledby="landing-title">
            <svg class="curve-definitions" aria-hidden="true" focusable="false" width="0" height="0">
                <defs>
                    <clipPath id="loginCurve" clipPathUnits="objectBoundingBox">
                        <path d="M0,0 H0.446 C0.452,0.12 0.548,0.22 0.588,0.45 C0.635,0.66 0.548,0.82 0.495,1 H0 Z" />
                    </clipPath>
                </defs>
            </svg>
            <div class="login-preview" aria-hidden="true"></div>
            <div class="artwork-space" aria-hidden="true"></div>
            <div class="content-panel">
                <div class="hero-copy">
                    <img class="quickqueue-logo" src="{% static 'qq/images/qqlogo.png' %}" alt="QuickQueue logo">
                    <h1 id="landing-title" aria-label="QuickQueue">
                        <span class="title-first-q">Q</span><span class="title-blue">uick</span><span class="title-second-q">Q</span><span class="title-blue">ueue</span>
                    </h1>
                    <p class="subtitle">
                        <span>A Smart Appointment and Queue</span>
                        <span>Management System for Barangays</span>
                    </p>
                    <a class="get-started" href="{% url 'signin' %}">Get Started</a>
                </div>
            </div>
        </section>
    </main>
    <script>
        const startButton = document.querySelector(".get-started");
        const heroCard = document.querySelector(".hero-card");
        const loginPreview = document.querySelector(".login-preview");

        if (startButton && heroCard && loginPreview) {
            const imageUrls = [...document.querySelectorAll('link[rel="preload"][as="image"]')]
                .map((link) => link.href);
            const imageReady = Promise.allSettled(imageUrls.map((src) => {
                const image = new Image();
                image.decoding = "async";
                image.src = src;
                return image.decode ? image.decode() : Promise.resolve();
            }));
            let isNavigating = false;
            let fallbackTimer;

            const finishNavigation = () => {
                if (!isNavigating) return;
                window.clearTimeout(fallbackTimer);
                sessionStorage.setItem("quickqueue.loginTransition", "1");
                window.location.assign(startButton.href);
            };

            const onTransitionEnd = (event) => {
                if (event.target === loginPreview && event.propertyName === "opacity") {
                    loginPreview.removeEventListener("transitionend", onTransitionEnd);
                    finishNavigation();
                }
            };

            startButton.addEventListener("click", async (event) => {
                event.preventDefault();
                if (isNavigating) return;

                isNavigating = true;
                startButton.setAttribute("aria-disabled", "true");
                startButton.style.pointerEvents = "none";

                await Promise.race([
                    imageReady,
                    new Promise((resolve) => window.setTimeout(resolve, 180)),
                ]);

                loginPreview.addEventListener("transitionend", onTransitionEnd);
                heroCard.classList.add("is-pressed");
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    heroCard.classList.remove("is-pressed");
                    heroCard.classList.add("is-transitioning");
                }));

                fallbackTimer = window.setTimeout(finishNavigation, 1100);
            });

            window.addEventListener("pagehide", () => {
                window.clearTimeout(fallbackTimer);
                loginPreview.removeEventListener("transitionend", onTransitionEnd);
            }, { once: true });
        }
    </script>
</body>
</html>
