{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQueue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'qq/css/landing.css' %}">
</head>
<body>
    <main class="landing-page">
        <section class="hero-card" aria-labelledby="landing-title">
            <div class="artwork-space" aria-hidden="true"></div>
            <div class="content-panel">
                <div class="hero-copy">
                    <img class="quickqueue-logo" src="{% static 'qq/images/qqlogo.png' %}" alt="QuickQueue logo">
                    <h1 id="landing-title" aria-label="QuickQueue">
                        <span class="title-first-q">Q</span><span class="title-blue">uick</span><span class="title-second-q">Q</span><span class="title-blue">ueue</span>
                    </h1>
                    <p class="subtitle">
                        <span>A Smart Appointment and Queue</span>
                        <span>Management System for Barangays</span>
                    </p>
                    <a class="get-started" href="{% url 'signin' %}">Get Started</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
