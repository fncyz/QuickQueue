{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Temporary Password | QuickQueue</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#061d50;font:14px Poppins,Arial}.card{width:min(440px,calc(100% - 32px));padding:30px;background:#fff;border:1px solid #dbe5f3;border-radius:16px;box-shadow:0 18px 55px #102d591c}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;border-radius:10px}h1{margin:24px 0 6px}p{color:#687ba1}.notice{padding:11px;color:#865a07;background:#fff5db;border-radius:8px}label{display:grid;gap:6px;margin:16px 0;font-weight:600}input{padding:12px;border:1px solid #ccd9ea;border-radius:8px}.errorlist{color:#bd3f4c}button{width:100%;padding:13px;color:#fff;background:#155eef;border:0;border-radius:8px;font-weight:700}.logout{display:block;margin-top:15px;color:#5c7090;text-align:center}</style></head><body><main class="card"><div class="brand"><img src="{% static 'qq/images/qqlogo.png' %}" alt=""><b>QuickQueue</b></div><h1>Change your password</h1><p class="notice">Your temporary password must be replaced before you can continue.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button>Set New Password</button></form><a class="logout" href="{% url 'staff_logout' %}">Logout</a></main></body></html>
