{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Document Templates | QuickQueue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'qq/css/barangay_sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'qq/css/barangay_dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'qq/css/document_templates.css' %}">
  <style>#template-dialog footer .secondary{width:auto;height:42px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;background:#f1f4f8;color:#4c6182;font:700 14px Poppins,sans-serif;line-height:1;border:1px solid #d7e1ef;border-radius:8px}</style>
</head>
<body>
<div class="shell">
  {% include 'barangay_admin/includes/sidebar.html' %}
  <main class="dashboard template-page" id="document-template-app" data-endpoint="{% url 'api_document_templates' %}">
    <header class="dashboard-header template-header">
      <div><h1>Document Templates</h1><p>Upload and manage the source document for each barangay service.</p></div>
      <button id="open-upload" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Upload Template</span></button>
    </header>

    <p id="feedback" role="status" aria-live="polite"></p>
    <section class="template-browser" aria-label="Document template library">
      <label class="template-search" for="template-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <input id="template-search" type="search" placeholder="Search document templates..." autocomplete="off">
      </label>
      <div id="template-list" class="template-grid" aria-live="polite"><p class="template-loading">Loading templates…</p></div>
    </section>
  </main>
</div>

<dialog id="template-dialog"><form id="template-form"><header><div><small id="dialog-label">NEW TEMPLATE</small><h2 id="dialog-title">Upload document template</h2></div><button type="button" class="close" aria-label="Close">×</button></header><div class="dialog-body"><label>Service<select name="service" id="template-service" required><option value="">Select service</option>{% for service in services %}<option value="{{ service.pk }}">{{ service.name }}</option>{% endfor %}</select></label><label>Template name<input name="name" id="template-name" maxlength="150" required placeholder="e.g. Certificate of Residency Template"></label><label>Template file<input name="template_file" id="template-file" type="file" accept=".pdf,.doc,.docx,.odt,.html,.txt" required><small>PDF, DOC, DOCX, ODT, HTML, or TXT. Maximum 10MB.</small></label></div><footer><button type="button" class="close secondary">Cancel</button><button type="submit">Save Template</button></footer></form></dialog>
<form class="csrf-bootstrap">{% csrf_token %}</form>
<script defer src="{% static 'qq/js/document_templates.js' %}"></script>
</body>
</html>
